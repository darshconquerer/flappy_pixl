name: Build Game for All Platforms

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]        
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
            separator: ":"
          - os: macos-latest
            name: mac
            separator: ":"
          - os: windows-latest
            name: windows
            separator: ";"

    runs-on: ${{ matrix.os }}

    steps:
    - name: Get the code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: pip install pygame pyinstaller

    - name: Build with PyInstaller
      run: pyinstaller --onefile --windowed --add-data "graphics${{ matrix.separator }}graphics" main.py

    - name: Package (Windows)
      if: matrix.name == 'windows'
      shell: pwsh
      run: Compress-Archive -Path dist/* -DestinationPath Flappy-windows.zip

    - name: Package (Linux/Mac)
      if: matrix.name != 'windows'
      run: tar -czf Flappy-${{ matrix.name }}.tar.gz -C dist .

    - name: Upload finished applications
      uses: actions/upload-artifact@v4
      with:
        name: game-build-${{ matrix.name }}
        path: Flappy-${{ matrix.name }}.*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')  
    runs-on: ubuntu-latest
    permissions:
      contents: write                            
    steps:
    - name: Download all builds
      uses: actions/download-artifact@v4
      with:
        path: release-files
        merge-multiple: true

    - name: Publish Release
      uses: softprops/action-gh-release@v2
      with:
        files: release-files/*
